<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
<title id="t">Quand chaque skill intervient</title>
<desc id="d">Six étapes d'un projet, chacune avec son skill : cadrer (grill-me), écrire (writing-for-agents), dessiner (schemas-zyphro), vérifier (verification-rigor), pousser (security-review), publier (qualite-sites) ; wizard sert à tout moment.</desc>
